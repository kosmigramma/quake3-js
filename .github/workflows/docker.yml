name: Docker Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-6)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.17.3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-stage image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: build
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quake3-js:latest
            ghcr.io/${{ github.repository_owner }}/quake3-js:${{ steps.sha.outputs.short }}

      - name: Extract built JS artifact
        uses: docker/build-push-action@v5
        with:
          context: .
          target: artifact
          outputs: type=local,dest=./out

      - name: Upload quake_game.externjs artifact
        uses: actions/upload-artifact@v4
        with:
          name: quake_game.externjs
          path: ./out/quake_game.externjs

      - name: Cleanup old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: quake3-js
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
